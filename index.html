<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSC Blockly Editor</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Blockly -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>

  <style>
    /* Fix 1: Ensure Blockly's flyout scrollbar hides cleanly when flyout is closed and never blocks trashcan */
    .blocklyFlyout[style*="display: none"] + .blocklyFlyoutScrollbar,
    .blocklyFlyout[aria-hidden="true"] + .blocklyFlyoutScrollbar {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Light-mode Gemini-styled Blockly UI (workspace & blocks only) */
    @keyframes rscBlockEnter {
      0% { opacity: 0; filter: brightness(1.18) drop-shadow(0 0 12px rgba(37, 99, 235, 0.35)); }
      100% { opacity: 1; filter: brightness(1) drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14)); }
    }
    @keyframes rscBlockSnap {
      0% { filter: drop-shadow(0 0 0 rgba(37, 99, 235, 0)); }
      35% { filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.55)); }
      100% { filter: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14)); }
    }
    @keyframes rscMenuPop {
      0% { opacity: 0; transform: translateY(-4px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes rscFlyoutFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .rsc-anim-enter > .blocklyPath {
      animation: rscBlockEnter 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rsc-anim-snap > .blocklyPath {
      animation: rscBlockSnap 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .blocklyTrash {
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 150ms ease, filter 150ms ease;
    }
    .blocklyTrash:hover {
      opacity: 1;
      filter: drop-shadow(0 2px 6px rgba(15, 23, 42, 0.2));
    }
    .blocklyZoom {
      opacity: 0.75;
      transition: opacity 150ms ease;
    }
    .blocklyZoom:hover { opacity: 1; }

    .blocklyToolboxDiv {
      background-color: #f1f5f9 !important;
      border-right: 1px solid #e2e8f0;
      padding-top: 10px;
    }
    .blocklyTreeRow {
      height: 34px !important;
      line-height: 34px !important;
      margin: 2px 8px !important;
      border-radius: 8px !important;
      padding-right: 12px !important;
      transition: background-color 150ms ease, transform 150ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 150ms ease;
    }
    .blocklyTreeRow:hover {
      background-color: #e2e8f0 !important;
      transform: translateX(2px);
    }
    .blocklyTreeRow.blocklyTreeSelected {
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
      transform: translateX(2px);
    }
    .blocklyTreeLabel {
      font-family: 'Inter', sans-serif !important;
      font-size: 13.5px !important;
      font-weight: 500 !important;
      color: #334155 !important;
      transition: color 150ms ease;
    }
    .blocklyTreeSelected .blocklyTreeLabel {
      color: #ffffff !important;
      font-weight: 600 !important;
    }

    .blocklyFlyout {
      animation: rscFlyoutFade 160ms ease-out;
    }
    .blocklyFlyoutBackground {
      fill: #f1f5f9 !important;
      fill-opacity: 0.96 !important;
    }

    .blocklyPath {
      stroke-width: 1.25px;
      transition: filter 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
    }
    .blocklyDraggable > .blocklyPath {
      filter: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14));
    }
    .blocklyDraggable:hover > .blocklyPath {
      filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.2));
    }
    .blocklyDragging > .blocklyPath {
      filter: drop-shadow(0 12px 24px rgba(15, 23, 42, 0.28));
    }
    .blocklySelected > .blocklyPath {
      stroke: #1e293b !important;
      stroke-width: 2.2px !important;
      filter: drop-shadow(0 4px 12px rgba(37, 99, 235, 0.3));
    }

    /* Bigger, crisp block label typography */
    .blocklyText {
      font-family: 'Inter', sans-serif !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      fill: #ffffff !important;
      letter-spacing: 0.005em;
    }

    /* Fixed light-mode editable field & dropdown pills (workspace + flyout tray, beats Zelos !important rules) */
    #blocklyDiv .blocklyFieldRect,
    #blocklyDiv .blocklyDropdownRect,
    #blocklyDiv .blocklyEditableField > rect.blocklyFieldRect,
    #blocklyDiv .blocklyEditableText > rect.blocklyFieldRect,
    #blocklyDiv .blocklyNonEditableField > rect.blocklyFieldRect,
    #blocklyDiv .blocklyNonEditableText > rect.blocklyFieldRect {
      fill: #ffffff !important;
      fill-opacity: 0.96 !important;
      stroke: rgba(15, 23, 42, 0.18) !important;
      stroke-width: 1px !important;
      rx: 7px;
      ry: 7px;
      transition: fill 140ms ease, stroke 140ms ease;
    }
    #blocklyDiv .blocklyEditableField:hover > rect.blocklyFieldRect,
    #blocklyDiv .blocklyEditableText:hover > rect.blocklyFieldRect,
    #blocklyDiv .blocklyEditableField:hover > .blocklyFieldRect,
    #blocklyDiv .blocklyEditableText:hover > .blocklyFieldRect,
    #blocklyDiv .blocklyEditableField:hover > .blocklyDropdownRect {
      fill: #ffffff !important;
      fill-opacity: 1 !important;
      stroke: rgba(15, 23, 42, 0.42) !important;
    }
    #blocklyDiv .blocklyFieldRect ~ text.blocklyText,
    #blocklyDiv .blocklyFieldRect ~ text.blocklyText tspan,
    #blocklyDiv .blocklyFieldRect ~ g text.blocklyText,
    #blocklyDiv .blocklyFieldRect ~ g text.blocklyText tspan,
    #blocklyDiv .blocklyDropdownRect ~ text.blocklyText,
    #blocklyDiv .blocklyDropdownRect ~ text.blocklyText tspan,
    #blocklyDiv .blocklyDropdownRect ~ g text.blocklyText,
    #blocklyDiv .blocklyDropdownRect ~ g text.blocklyText tspan,
    #blocklyDiv .blocklyEditableField text.blocklyText,
    #blocklyDiv .blocklyEditableField text.blocklyText tspan,
    #blocklyDiv .blocklyEditableText text.blocklyText,
    #blocklyDiv .blocklyEditableText text.blocklyText tspan,
    #blocklyDiv .blocklyNonEditableField text.blocklyText,
    #blocklyDiv .blocklyNonEditableField text.blocklyText tspan,
    #blocklyDiv .blocklyNonEditableText text.blocklyText,
    #blocklyDiv .blocklyNonEditableText text.blocklyText tspan,
    #blocklyDiv text.blocklyDropdownText,
    #blocklyDiv text.blocklyDropdownText tspan,
    #blocklyDiv .blocklyDropdownText,
    #blocklyDiv .blocklyDropdownText tspan,
    #blocklyDiv .blocklyDropdownArrow {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      fill: #0f172a !important;
    }
    .blocklyHtmlInput {
      background-color: #ffffff !important;
      color: #0f172a !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      border: 1.5px solid #2563eb !important;
      border-radius: 7px !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18) !important;
      transition: box-shadow 140ms ease, border-color 140ms ease;
    }

    /* Light-mode dropdown & context menus */
    body .blocklyDropDownDiv {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 10px !important;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16) !important;
      animation: rscMenuPop 140ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body .blocklyDropDownDiv .blocklyDropDownArrow {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
    }
    body .blocklyDropDownDiv .blocklyMenu {
      background-color: transparent !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItem,
    body .blocklyDropDownDiv .blocklyMenuItemContent {
      color: #0f172a !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      border-radius: 6px !important;
      transition: background-color 120ms ease, color 120ms ease;
    }
    body .blocklyDropDownDiv .blocklyMenuItemSelected .blocklyMenuItemContent {
      color: #0f172a !important;
      font-weight: 600 !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemCheckbox {
      filter: brightness(0) saturate(100%) invert(26%) sepia(93%) saturate(2351%) hue-rotate(213deg) brightness(95%) contrast(94%) !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemHighlight,
    body .blocklyWidgetDiv .blocklyMenuItemHighlight {
      background-color: rgba(37, 99, 235, 0.12) !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemHighlight .blocklyMenuItemContent,
    body .blocklyWidgetDiv .blocklyMenuItemHighlight .blocklyMenuItemContent {
      color: #1d4ed8 !important;
    }
    body .blocklyWidgetDiv .blocklyMenu {
      background-color: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 10px !important;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16) !important;
      padding: 4px !important;
      animation: rscMenuPop 140ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body .blocklyWidgetDiv .blocklyMenuItemContent {
      color: #1e293b !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 13px !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemDisabled .blocklyMenuItemContent,
    body .blocklyWidgetDiv .blocklyMenuItemDisabled .blocklyMenuItemContent {
      color: #94a3b8 !important;
    }

    /* Light-mode flyout buttons */
    .blocklyFlyoutButton { cursor: pointer; }
    .blocklyFlyoutButtonShadow { fill: transparent !important; }
    .blocklyFlyoutButtonBackground {
      fill: #ffffff !important;
      stroke: #cbd5e1 !important;
      stroke-width: 1px !important;
      rx: 8px;
      ry: 8px;
      transition: fill 150ms ease, stroke 150ms ease, filter 150ms ease;
    }
    .blocklyFlyoutButton:hover .blocklyFlyoutButtonBackground {
      fill: #eff6ff !important;
      stroke: #2563eb !important;
      filter: drop-shadow(0 2px 5px rgba(37, 99, 235, 0.16));
    }
    #blocklyDiv .blocklyFlyoutButton .blocklyText {
      fill: #1e293b !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 13px !important;
      font-weight: 500 !important;
    }
 
    #bm-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:999; padding:16px; }
    #bm-box { background:#1e1e1e; color:#eee; padding:12px; border:1px solid #555; display:flex; flex-direction:column; gap:8px; max-width:90vw; max-height:90vh; }
    #bm-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-family:monospace; }
    #bm-bar input { width:46px; background:#111; color:#eee; border:1px solid #555; padding:2px 4px; font:inherit; }
    #bm-bar button { background:#333; color:#eee; border:1px solid #666; padding:2px 8px; font:inherit; cursor:pointer; }
    #bm-wrap { overflow:auto; max-height:65vh; border:1px solid #444; background:#fff; align-self:center; }
    #bm-cv { display:block; cursor:crosshair; image-rendering:pixelated; }
    #ui-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.68); align-items:center; justify-content:center; z-index:1000; padding:16px; }
    #ui-modal-box { width:min(360px, 90vw); background:#1e1e1e; color:#eee; border:1px solid #525252; border-radius:6px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    #ui-modal-title { margin:0 0 12px; font-size:14px; font-weight:600; }
    #ui-modal-body { display:flex; flex-direction:column; gap:8px; font-size:13px; }
    #ui-modal-body input, #ui-modal-body select { width:100%; box-sizing:border-box; background:#111; color:#eee; border:1px solid #555; border-radius:3px; padding:7px 8px; }
    #ui-modal-actions { display:flex; justify-content:flex-end; gap:6px; margin-top:12px; }
    #ui-modal-actions button { border:1px solid #666; border-radius:3px; background:#333; color:#eee; padding:5px 10px; cursor:pointer; }
    #ui-modal-actions button:last-child { background:#e5e5e5; color:#171717; border-color:#e5e5e5; }
    #btn-about { width:18px; height:18px; padding:0; border:0; border-radius:50%; background:transparent; color:#525252; font-size:12px; line-height:18px; }
    #btn-about:hover { color:#a3a3a3; }
    #notif-win {
      display:none; position:fixed; right:20px; bottom:20px; width:min(380px, calc(100vw - 32px)); max-height:46vh;
      background:#111111; color:#e5e5e5; border:1px solid #2e2e2e; border-radius:8px;
      box-shadow:0 16px 40px rgba(0,0,0,.55); z-index:950; flex-direction:column; overflow:hidden;
    }
    #notif-hdr {
      display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px;
      background:#171717; border-bottom:1px solid #262626; cursor:move; user-select:none;
    }
    #notif-list { padding:8px 10px; overflow:auto; display:flex; flex-direction:column; gap:6px; font-family:'JetBrains Mono',monospace; font-size:12px; }
    .notif-item { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:5px; padding:6px 8px; white-space:pre-wrap; word-break:break-word; color:#e5e5e5; }
    .notif-empty { color:#737373; font-style:italic; padding:4px 2px; }

  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans h-screen flex flex-col lg:flex-row overflow-hidden antialiased selection:bg-orange-500/30">

  <!-- Left / Top: Blockly Workspace -->
  <main class="flex-1 relative min-h-[58%] lg:min-h-0 bg-neutral-100 overflow-hidden">
    <div id="blocklyDiv" class="absolute inset-0 w-full h-full"></div>
  </main>

  <!-- Right / Bottom: Minimal RSC Output Panel -->
  <aside class="w-full lg:w-[380px] xl:w-[440px] h-[42%] lg:h-full bg-neutral-950 border-t lg:border-t-0 lg:border-l border-neutral-800 flex flex-col shrink-0">
    
    <!-- Minimal Controls Strip -->
    <div class="px-3 py-2 border-b border-neutral-800/80 flex flex-wrap items-center justify-between gap-1.5 shrink-0">
      <div class="flex items-center gap-1.5">
        <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-500">RSC</span>
        <button id="btn-about" type="button" title="About">i</button>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button 
          id="btn-save" 
          type="button"
          title="Save project file (Ctrl+S)"
          class="px-2 py-1 text-xs font-medium rounded bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-neutral-800 transition-colors cursor-pointer"
        >
          Save
        </button>
        <button 
          id="btn-load" 
          type="button"
          title="Load project file"
          class="px-2 py-1 text-xs font-medium rounded bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-neutral-800 transition-colors cursor-pointer"
        >
          Load
        </button>
        <input id="file-load" type="file" accept=".json,.rscb" class="hidden" />
        <button 
          id="btn-notifs" 
          type="button"
          title="Notifications"
          class="px-2 py-1 text-xs font-medium rounded bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-neutral-800 transition-colors cursor-pointer flex items-center gap-1"
        >
          <span>Notifs</span><span id="notif-badge" class="text-[10px] font-mono px-1 rounded bg-neutral-800 text-neutral-400">0</span>
        </button>
        <button 
          id="btn-compile" 
          type="button"
          class="px-2.5 py-1 text-xs font-medium rounded bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-wait text-white transition-colors cursor-pointer"
        >
          Compile
        </button>
        <button 
          id="btn-reset" 
          type="button"
          class="px-2 py-1 text-xs font-medium rounded bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-neutral-800 transition-colors cursor-pointer"
        >
          Reset
        </button>
        <button 
          id="btn-copy" 
          type="button"
          class="px-2.5 py-1 text-xs font-medium rounded bg-neutral-100 hover:bg-white text-neutral-950 transition-colors cursor-pointer"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- Live Output -->
    <div class="flex-1 min-h-0 p-4 overflow-auto">
      <pre id="rsc-output" class="font-mono text-sm leading-relaxed text-neutral-100 whitespace-pre select-all">@section.main at 0xD730 backup 0xE9E0</pre>
    </div>

    <!-- Compiled Output Pane -->
    <div id="compile-pane" class="hidden h-[44%] border-t border-neutral-800 bg-neutral-950 flex flex-col shrink-0">
      <div class="px-3 py-1.5 border-b border-neutral-800/80 flex items-center justify-between shrink-0 bg-neutral-900/60">
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-400">Compiled</span>
          <span id="compile-status" class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-neutral-800 text-neutral-300">Idle</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button 
            id="btn-api-url" 
            type="button"
            title="Configure compiler API / proxy URL"
            class="px-2 py-0.5 text-[11px] font-medium rounded bg-neutral-800 hover:bg-neutral-700 text-neutral-300 transition-colors cursor-pointer"
          >
            API
          </button>
          <button 
            id="btn-copy-compiled" 
            type="button"
            class="px-2 py-0.5 text-[11px] font-medium rounded bg-neutral-800 hover:bg-neutral-700 text-neutral-200 transition-colors cursor-pointer"
          >
            Copy
          </button>
          <button 
            id="btn-close-compiled" 
            type="button"
            title="Close"
            class="px-1.5 py-0.5 text-xs text-neutral-400 hover:text-neutral-100 cursor-pointer"
          >
            &times;
          </button>
        </div>
      </div>
      <div class="flex-1 min-h-0 p-3 overflow-auto">
        <pre id="compile-output" class="font-mono text-xs leading-relaxed text-neutral-200 whitespace-pre-wrap break-all select-all"></pre>
      </div>
    </div>

  </aside>

  <!-- Separate Floating Notifications Window -->
  <div id="notif-win" role="dialog" aria-label="Compiler Notifications">
    <div id="notif-hdr">
      <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-400">Notifications</span>
      <div class="flex items-center gap-1.5">
        <button id="notif-clear" type="button" class="px-2 py-0.5 text-[11px] rounded bg-neutral-800 hover:bg-neutral-700 text-neutral-300 cursor-pointer">Clear</button>
        <button id="notif-close" type="button" title="Close" class="px-1.5 py-0.5 text-xs text-neutral-400 hover:text-neutral-100 cursor-pointer">&times;</button>
      </div>
    </div>
    <div id="notif-list"><div class="notif-empty">No notifications.</div></div>
  </div>

  <div id="bm-modal">
    <div id="bm-box">
      <div id="bm-bar">
        <span>W:</span><input id="bm-w" type="number" min="1" max="128" value="8">
        <span>H:</span><input id="bm-h" type="number" min="1" max="128" value="8">
        <button id="bm-resize" type="button">Resize</button>
        <button id="bm-clear" type="button">Clear</button>
        <button id="bm-inv" type="button">Invert</button>
        <button id="bm-done" type="button">Done</button>
      </div>
      <div id="bm-wrap"><canvas id="bm-cv"></canvas></div>
    </div>
  </div>
  <div id="ui-modal">
    <div id="ui-modal-box">
      <h2 id="ui-modal-title"></h2>
      <div id="ui-modal-body"></div>
      <div id="ui-modal-actions">
        <button id="ui-modal-cancel" type="button">Cancel</button>
        <button id="ui-modal-confirm" type="button">OK</button>
      </div>
    </div>
  </div>

  <script>
(() => {
  const geminiTheme = Blockly.Theme.defineTheme('rscGeminiLight', {
    base: Blockly.Themes.Zelos || Blockly.Themes.Classic,
    blockStyles: {
      dt_blocks:      { colourPrimary: '#0f766e', colourSecondary: '#115e59', colourTertiary: '#134e4a' },
      starter_blocks: { colourPrimary: '#d95716', colourSecondary: '#b8430b', colourTertiary: '#9a3412' },
      memory_blocks:  { colourPrimary: '#2563eb', colourSecondary: '#1d4ed8', colourTertiary: '#1e40af' },
      gadget_blocks:  { colourPrimary: '#7c3aed', colourSecondary: '#6d28d9', colourTertiary: '#5b21b6' },
      eval_blocks:    { colourPrimary: '#be123c', colourSecondary: '#9f1239', colourTertiary: '#881337' },
      misc_blocks:    { colourPrimary: '#475569', colourSecondary: '#334155', colourTertiary: '#1e293b' }
    },
    categoryStyles: {
      dt_category:      { colour: '#0f766e' },
      starter_category: { colour: '#d95716' },
      memory_category:  { colour: '#2563eb' },
      gadget_category:  { colour: '#7c3aed' },
      eval_category:    { colour: '#be123c' },
      misc_category:    { colour: '#475569' }
    },
    componentStyles: {
      workspaceBackgroundColour: '#f8fafc',
      toolboxBackgroundColour: '#f1f5f9',
      toolboxForegroundColour: '#334155',
      flyoutBackgroundColour: '#f1f5f9',
      flyoutForegroundColour: '#1e293b',
      flyoutOpacity: 0.96,
      scrollbarColour: '#cbd5e1',
      scrollbarOpacity: 0.8,
      insertionMarkerColour: '#2563eb',
      insertionMarkerOpacity: 0.35,
      selectedGlowColour: '#2563eb',
      selectedGlowOpacity: 0.3
    },
    fontStyle: {
      family: 'Inter, sans-serif',
      weight: '500',
      size: 14
    }
  });
  const svg = d => 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="4.5" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.55)" stroke-width="1"/><path d="${d}" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg>`
  );
  const ADD_ICON = svg('M8 4v8M4 8h8');
  const SUB_ICON = svg('M4 8h8');
  const SWAP_ICON = svg('M4 5.5h8M9.5 3.2L12 5.5l-2.5 2.3M12 10.5H4M6.5 8.2L4 10.5l2.5 2.3');

  const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isLabelBlock = b => !!b && (b.type === 'rsc_label' || (b.type === 'rsc_loop_back' && !!b.hasLabel_));

  function getLabelBlocks() {
    if (!ws) return [];
    return ws.getAllBlocks(false).filter(b => !b.isShadow() && isLabelBlock(b));
  }

  function isLabelNameTaken(name, excludeBlock) {
    const target = (name || '').trim();
    if (!target) return false;
    return getLabelBlocks().some(b => b !== excludeBlock && (b.getFieldValue('NAME') || '').trim() === target);
  }

  function makeUniqueLabelName(base, excludeBlock) {
    const clean = (base || 'label').trim() || 'label';
    if (!isLabelNameTaken(clean, excludeBlock)) return clean;
    const stem = clean.replace(/\d+$/, '') || clean;
    let n = 2;
    while (isLabelNameTaken(stem + n, excludeBlock)) n++;
    return stem + n;
  }

  function findLabelBlock(name) {
    const target = (name || '').trim();
    if (!target) return null;
    return getLabelBlocks().find(b => (b.getFieldValue('NAME') || '').trim() === target) || null;
  }

  function findSectionForLabel(name) {
    const blk = findLabelBlock(name);
    if (!blk) return null;
    const root = blk.getRootBlock();
    return (root && root.type === 'rsc_section') ? root : null;
  }

  function isAddrOfBackupLocked(blk) {
    if (!blk || blk.isInFlyout) return false;
    const name = (blk.getFieldValue('NAME') || '').trim();
    if (!name) return false;
    const lbl = findLabelBlock(name);
    if (!lbl) return false;
    const sec = findSectionForLabel(name);
    return !(sec && sec.hasBackup_);
  }

  function parseHexAddr(v) {
    const clean = (v || '').trim().replace(/^0x/i, '');
    return /^[0-9a-f]+$/i.test(clean) ? parseInt(clean, 16) : NaN;
  }

  function calcBackupDelta(sec) {
    if (!sec || !sec.hasBackup_) return null;
    const norm = parseHexAddr(sec.getFieldValue('ADDR'));
    const bak = parseHexAddr(sec.getFieldValue('BACKUP'));
    if (Number.isNaN(norm) || Number.isNaN(bak)) return null;
    return bak - norm;
  }

  function syncAddrOfBlocks() {
    if (!ws) return;
    for (const blk of ws.getAllBlocks(false)) {
      if (blk.type !== 'rsc_addr_of' || blk.isShadow()) continue;
      const locked = isAddrOfBackupLocked(blk);
      if (locked && blk.getFieldValue('MODE') === 'backup') {
        Blockly.Events.disable();
        try {
          blk.setFieldValue('normal', 'MODE');
        } finally {
          Blockly.Events.enable();
        }
      }
      const modeField = blk.getField('MODE');
      if (modeField && typeof modeField.getOptions === 'function') {
        modeField.getOptions(false);
      }
    }
  }

  class FieldUniqueLabel extends Blockly.FieldTextInput {
    showEditor_(e) {
      this.prevValidName_ = this.getValue();

    }
    widgetDispose_() {
      super.widgetDispose_();
      const blk = this.getSourceBlock();
      if (!blk || blk.isInFlyout || !ws || blk.workspace !== ws) return;
      const raw = (this.getValue() || '').trim();
      const defName = blk.type === 'rsc_loop_back' ? 'restore' : 'start';
      if (!raw) {
        const prev = (this.prevValidName_ || '').trim();
        const fallback = (prev && !isLabelNameTaken(prev, blk)) ? prev : makeUniqueLabelName(defName, blk);
        this.setValue(fallback);
      } else if (isLabelNameTaken(raw, blk)) {
        const prev = (this.prevValidName_ || '').trim();
        const fallback = (prev && !isLabelNameTaken(prev, blk)) ? prev : makeUniqueLabelName(raw, blk);
        this.setValue(fallback);
        openUiModal(
          'Duplicate label name',
          `<p>A label named "<strong>${escHtml(raw)}</strong>" already exists. Label names must be unique.</p>`,
          'OK',
          closeUiModal

      } else if (raw !== this.getValue()) {

      }
      syncAddrOfBlocks();
      validateLoopBackBlocks(false);

  function setDtShape(b, asStmt) {
    b.isStmt_ = !!asStmt && !b.isShadow();
    if (b.isStmt_) {
      if (b.outputConnection && b.outputConnection.isConnected()) b.outputConnection.disconnect();
      b.setOutput(false);
      b.setPreviousStatement(true, 'STMT');
      b.setNextStatement(true, 'STMT');
    } else {
      if (b.previousConnection && b.previousConnection.isConnected()) b.previousConnection.disconnect();
      if (b.nextConnection && b.nextConnection.isConnected()) b.nextConnection.disconnect();
      b.setPreviousStatement(false);
      b.setNextStatement(false);
      b.setOutput(true);
    }
  }

  function toggleDtShape(b) {
    if (!b || b.isInFlyout || b.isShadow()) return;
    const nextStmt = !b.isStmt_;
    let wasConnected = false;
    Blockly.Events.setGroup(true);
    try {
      if (nextStmt) {
        if (b.outputConnection && b.outputConnection.isConnected()) {
          wasConnected = true;
          b.outputConnection.disconnect();
        }
      } else {
        if ((b.previousConnection && b.previousConnection.isConnected()) ||
            (b.nextConnection && b.nextConnection.isConnected())) {
          wasConnected = true;
          b.unplug(true);
        }
      }
      setDtShape(b, nextStmt);
      if (wasConnected) b.moveBy(18, 22);
      if (b.rendered) b.render();
      pulseBlock(b.id, 'rsc-anim-snap', 280);
    } finally {
      Blockly.Events.setGroup(false);
    }
    if (ws && b.workspace === ws) updateOutput();
  }

  const bmModal = document.getElementById('bm-modal');
  const bmW = document.getElementById('bm-w');
  const bmH = document.getElementById('bm-h');
  const bmCv = document.getElementById('bm-cv');
  const bmCtx = bmCv.getContext('2d');
  let activeBmBlock = null, editW = 8, editH = 8, editBits = [], paintVal = 1, painting = false;

  function drawBm() {
    const cell = Math.max(8, Math.min(22, Math.floor(360 / Math.max(editW, editH))));
    bmCv.width = editW * cell;
    bmCv.height = editH * cell;
    bmCv.dataset.cell = String(cell);
    drawBmPixels();
  }

  function drawBmPixels() {
    const cell = Number(bmCv.dataset.cell) || 8;
    bmCtx.fillStyle = '#fff';
    bmCtx.fillRect(0, 0, bmCv.width, bmCv.height);
    bmCtx.fillStyle = '#000';
    for (let y = 0; y < editH; y++) {
      for (let x = 0; x < editW; x++) {
        if (editBits[y * editW + x]) bmCtx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    bmCtx.strokeStyle = '#ccc';
    bmCtx.lineWidth = 1;
    for (let x = 0; x <= editW; x++) {
      bmCtx.beginPath(); bmCtx.moveTo(x * cell + .5, 0); bmCtx.lineTo(x * cell + .5, bmCv.height); bmCtx.stroke();
    }
    for (let y = 0; y <= editH; y++) {
      bmCtx.beginPath(); bmCtx.moveTo(0, y * cell + .5); bmCtx.lineTo(bmCv.width, y * cell + .5); bmCtx.stroke();
    }
  }

  function openBmEditor(block) {
    if (!block || block.isInFlyout || !block.workspace || block.workspace !== ws) return;
    activeBmBlock = block;
    editW = block.bmW_;
    editH = block.bmH_;
    editBits = block.bmBits_.slice();
    bmW.value = editW;
    bmH.value = editH;
    const flyout = ws.getFlyout();
    if (flyout && flyout.isVisible()) flyout.hide();
    bmModal.style.display = 'flex';
    drawBm();
    Blockly.svgResize(ws);
  }

  function cvCell(e) {
    const r = bmCv.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / (r.width / editW));
    const y = Math.floor((e.clientY - r.top) / (r.height / editH));
    return (x >= 0 && x < editW && y >= 0 && y < editH) ? y * editW + x : -1;
  }

  bmCv.addEventListener('pointerdown', e => {
    const i = cvCell(e);
    if (i < 0) return;
    painting = true;
    bmCv.setPointerCapture(e.pointerId);
    paintVal = editBits[i] ? 0 : 1;
    editBits[i] = paintVal;
    drawBmPixels();
  });
  bmCv.addEventListener('pointermove', e => {
    if (!painting) return;
    const i = cvCell(e);
    if (i >= 0 && editBits[i] !== paintVal) {
      editBits[i] = paintVal;
      drawBmPixels();
    }
  });
  bmCv.addEventListener('pointerup', () => { painting = false; });
  bmCv.addEventListener('pointercancel', () => { painting = false; });
  bmCv.addEventListener('lostpointercapture', () => { painting = false; });

  document.getElementById('bm-resize').onclick = () => {
    const nw = Math.max(1, Math.min(128, parseInt(bmW.value, 10) || 8));
    const nh = Math.max(1, Math.min(128, parseInt(bmH.value, 10) || 8));
    bmW.value = nw; bmH.value = nh;
    const next = new Array(nw * nh).fill(0);
    for (let y = 0; y < Math.min(editH, nh); y++) {
      for (let x = 0; x < Math.min(editW, nw); x++) {
        next[y * nw + x] = editBits[y * editW + x] || 0;
      }
    }
    editW = nw; editH = nh; editBits = next;
    drawBm();
  };
  document.getElementById('bm-clear').onclick = () => { editBits.fill(0); drawBm(); };
  document.getElementById('bm-inv').onclick = () => { editBits = editBits.map(v => v ? 0 : 1); drawBm(); };
  document.getElementById('bm-done').onclick = () => {
    if (activeBmBlock) {
      activeBmBlock.bmW_ = editW;
      activeBmBlock.bmH_ = editH;

  // --- RSC Generator ---
  const RSC = new Blockly.Generator('RSC');
  RSC.INDENT = '  ';
  const emitDt = (b, code) => b.outputConnection ? [code, 0] : code + '\n';

  RSC.scrub_ = function(block, code, thisOnly) {
    if (thisOnly) return code;
    let next = block.nextConnection && block.nextConnection.targetBlock();
    if (block.type === 'rsc_section' || (isLabelBlock(block) && !block.getSurroundParent())) {
      while (next && !isLabelBlock(next)) {
        next = next.nextConnection && next.nextConnection.targetBlock();
      }
    }
    return next ? code + this.blockToCode(next) : code;
  };

  RSC.workspaceToCode = function(ws) {
    this.init(ws);
    const out = [];
    for (const b of ws.getTopBlocks(true)) {
      if (b.type !== 'rsc_section' || !b.isEnabled()) continue;
      const c = this.blockToCode(b);
      if (c) out.push((Array.isArray(c) ? c[0] : c).trimEnd());
    }
    return this.finish(out.join('\n\n'));
  };

  RSC.forBlock['rsc_hex_byte'] = b => {
    const bytes = fmtHex(b.getFieldValue('V'));
    return [bytes ? 'hex ' + bytes : 'hex', 0];
  };
  RSC.forBlock['rsc_hex_addr'] = b => [b.getFieldValue('V').trim(), 0];
  RSC.forBlock['rsc_eval_val'] = b => [(b.getFieldValue('V') || '0').trim() || '0', 0];

  RSC.forBlock['rsc_string']  = b => emitDt(b, `"${b.getFieldValue('V')}"`);
  RSC.forBlock['rsc_integer'] = b => emitDt(b, String(b.getFieldValue('V')));
  RSC.forBlock['rsc_token']   = b => emitDt(b, `'${b.getFieldValue('V')}'`);
  RSC.forBlock['rsc_0x']        = b => emitDt(b, hex0x(b.getFieldValue('V')));
  RSC.forBlock['rsc_0x_shadow'] = b => [hex0x(b.getFieldValue('V')), 0];
  RSC.forBlock['rsc_hex']     = b => {
    const parts = [];
    for (let i = 0; i < b.itemCount_; i++) {
      const bytes = fmtHex(b.getFieldValue('V' + i) || '');
      if (bytes) parts.push(bytes);
    }
    return emitDt(b, parts.length ? 'hex ' + parts.join(' ') : 'hex');
  };
  RSC.forBlock['rsc_bitmap']  = b => {
    const bytes = [];
    for (let y = 0; y < b.bmH_; y++) {
      for (let x = 0; x < b.bmW_; x += 8) {
        let byte = 0;
        for (let bit = 0; bit < 8; bit++) {
          if (x + bit < b.bmW_ && b.bmBits_[y * b.bmW_ + x + bit]) byte |= (1 << (7 - bit));
        }
        bytes.push(byte.toString(16).padStart(2, '0'));
      }
    }
    return emitDt(b, bytes.length ? 'hex ' + bytes.join(' ') : 'hex');
  };
  RSC.forBlock['rsc_table']   = (b, g) => {
    const vals = [];
    for (let i = 0; i < b.itemCount_; i++) {
      const v = g.valueToCode(b, 'I' + i, 0);
      if (v !== '') vals.push(v);
    }
    return emitDt(b, `[${vals.join(',')}]`);
  };

  RSC.forBlock['rsc_section'] = b => {
    const bak = b.hasBackup_ ? ` backup ${hex0x(b.getFieldValue('BACKUP'))}` : '';
    return `@section.${b.getFieldValue('NAME')} at ${hex0x(b.getFieldValue('ADDR'))}${bak}\n`;
  };
  RSC.forBlock['rsc_break'] = () => 'brk\n';

  const RESET_OUT = {
    all: 'setlr_pc\nsetsfr\ndi,rt',
    buffer: 'buffer_clear',
    lr_pc: 'setlr_pc',
    sfr: 'setsfr',
    'di,rt': 'di,rt'
  };
  RSC.forBlock['rsc_reset'] = b => RESET_OUT[b.getFieldValue('OPT')] + '\n';

  RSC.forBlock['rsc_label'] = (b, g) =>
    `lbl ${b.getFieldValue('NAME')}\n${g.statementToCode(b, 'BODY')}`;
  RSC.forBlock['rsc_addr_of'] = b => {
    const name = (b.getFieldValue('NAME') || '').trim();
    const mode = b.getFieldValue('MODE') || 'normal';
    if (mode === 'backup' && !isAddrOfBackupLocked(b)) {
      const lblSec = findSectionForLabel(name);
      const ownRoot = b.getRootBlock();
      const sec = lblSec || (ownRoot && ownRoot.type === 'rsc_section' && ownRoot.hasBackup_ ? ownRoot : null);
      const diff = calcBackupDelta(sec);
      if (diff !== null) {
        const op = diff < 0 ? '-' : '+';
        const mag = '0x' + Math.abs(diff).toString(16);
        return [`eval(adr(${name}) ${op} ${mag})`, 0];
      }
      return [`eval(adr(${name}) + 0x0)`, 0];
    }
    return [`adr(${name})`, 0];
  };
  RSC.forBlock['rsc_set_addr'] = (b, g) => {
    const addr = stripHex(g.valueToCode(b, 'ADDR', 0) || '0x0000');
    const val = g.valueToCode(b, 'VAL', 0) || '0x00';
    return `xr0 = ${addr}, ${val}, 0x00\n[er0]=r2\n`;
  };
  RSC.forBlock['rsc_loop_back'] = b => {
    const target = (b.getFieldValue('TARGET') || 'start').trim() || 'start';
    const targetSec = findSectionForLabel(target);
    const ownRoot = b.getRootBlock();
    const sec = targetSec || (ownRoot && ownRoot.type === 'rsc_section' ? ownRoot : null);
    const secName = (sec ? (sec.getFieldValue('NAME') || 'main').trim() : 'main') || 'main';
    const addr = `adr(${target})`;
    const body = [
      'pop xr4, pop xr12',
      addr,
      'hex fe03',
      `eval(${addr}+dist.${secName})`,
      `eval(${addr}-0xc)`,
      'memcpy_auto_jump'
    ];
    if (b.hasLabel_) {
      const name = (b.getFieldValue('NAME') || 'restore').trim() || 'restore';
      const ind = RSC.INDENT;
      return `lbl ${name}\n` + body.map(line => ind + line).join('\n') + '\n';
    }
    return body.join('\n') + '\n';
  };

  RSC.forBlock['rsc_smallprint'] = (b, g) => {
    const pos = (g.valueToCode(b, 'POS', 0) || '0x00').trim();
    const font = b.getFieldValue('FONT') || '0x0e';
    const addr = (g.valueToCode(b, 'ADDR', 0) || '0x0000').trim();
    return `xr0 = ${font}, ${pos}, ${addr}\nsmallprint\n`;
  };
  RSC.forBlock['rsc_render'] = () => 'render.ddd4\n';
  RSC.forBlock['rsc_waitshift'] = () => 'waitshift\n';
  RSC.forBlock['rsc_render_bitmap'] = (b, g) => {
    const b0 = (g.valueToCode(b, 'B0', 0) || 'hex 00').trim();
    const b1 = (g.valueToCode(b, 'B1', 0) || 'hex 00').trim();
    const b2 = (g.valueToCode(b, 'B2', 0) || 'hex 00').trim();
    const b3 = (g.valueToCode(b, 'B3', 0) || 'hex 00').trim();
    const asset = (g.valueToCode(b, 'ASSET', 0) || '0x0000').trim();
    return `xr0 = ${b0}, ${b1}, ${b2}, ${b3}\nrender_bitmap\ner0 = ${asset}\n`;
  };
  RSC.forBlock['rsc_delay'] = (b, g) => {
    const ticks = (g.valueToCode(b, 'TICKS', 0) || '0x0000').trim();
    return `er0 = ${ticks}\ndelay\n`;
  };
  RSC.forBlock['rsc_calculate'] = (b, g) => {
    const calcPtr = (g.valueToCode(b, 'CALC_PTR', 0) || '0x0000').trim();
    const resultAddr = (g.valueToCode(b, 'RESULT_ADDR', 0) || '0x0000').trim();
    return `xr0 = ${calcPtr}, ${resultAddr}\ncalc_func\n`;
  };
  RSC.forBlock['rsc_set_invert'] = b =>
    `xr0 = 0xD138, ${b.getFieldValue('MODE') || '0x01'}, 0x00\n[er0]=r2\n`;
  RSC.forBlock['rsc_draw_line'] = (b, g) => {
    const x1 = (g.valueToCode(b, 'X1', 0) || '0x00').trim();
    const y1 = (g.valueToCode(b, 'Y1', 0) || '0x00').trim();
    const x2 = (g.valueToCode(b, 'X2', 0) || '0x00').trim();
    const y2 = (g.valueToCode(b, 'Y2', 0) || '0x00').trim();
    return `xr0 = ${x1}, ${y1}, ${x2}, ${y2}\nline_draw\n`;
  };
  const unwrapEvalExpr = expr => {
    const m = expr.match(/^eval\((.*)\)$/i);
    return m ? `(${m[1]})` : expr;
  };
  RSC.forBlock['rsc_eval_op'] = (b, g) => {
    const a = unwrapEvalExpr((g.valueToCode(b, 'A', 0) || '0').trim() || '0');
    const op = b.getFieldValue('OP') || '+';
    const c = unwrapEvalExpr((g.valueToCode(b, 'B', 0) || '0').trim() || '0');
    return emitDt(b, `eval(${a}${op}${c})`);
  };
  RSC.forBlock['rsc_custom_code'] = b => {
    const lines = [];
    for (let i = 0; i < b.lineCount_; i++) {
      const line = (b.getFieldValue('C' + i) || '').trimEnd();
      if (line.trim() !== '') lines.push(line);
    }
    return lines.length ? lines.join('\n') + '\n' : '';
  };

      '<p>Made by Pancake and Omelets, @pancake94_ on Discord.</p>',
      'Close',
      closeUiModal
    );
  });

  const out = document.getElementById('rsc-output');
  let sectionWarningShown = false;
  let backupWarningShown = false;
  let customCodeWarningShown = false;
  let pendingCustomCodeWarning = false;

  function pulseBlock(blockId, cls, ms) {
    const blk = blockId && ws.getBlockById(blockId);
    if (!blk || blk.isShadow()) return;
    const root = blk.getSvgRoot && blk.getSvgRoot();
    if (!root) return;
    root.classList.remove(cls);
    void root.getBoundingClientRect();
    root.classList.add(cls);
    setTimeout(() => root.classList.remove(cls), ms);
  }

  function validateLoopBackBlocks(showModalOnMissing) {
    let missingSecName = null;
    for (const blk of ws.getAllBlocks(false)) {
      if (blk.type !== 'rsc_loop_back') continue;
      const root = blk.getRootBlock();
      if (!root || root.type !== 'rsc_section') {
        blk.setWarningText(null);
        continue;
      }
      const target = (blk.getFieldValue('TARGET') || '').trim();
      const targetSec = findSectionForLabel(target);
      if (!target || !targetSec) {
        blk.setWarningText(target ? `Label "${target}" was not found in any section.` : 'Enter a target label name.');
      } else if (!targetSec.hasBackup_) {
        const secName = (targetSec.getFieldValue('NAME') || 'main').trim() || 'main';
        blk.setWarningText(`Section "${secName}" (containing label "${target}") requires a backup address.`);
        missingSecName = secName;
      } else {
        blk.setWarningText(null);
      }
    }
    if (showModalOnMissing && missingSecName && !backupWarningShown) {
      backupWarningShown = true;
      openUiModal(
        'Backup address required',
        `<p>The "loop back" block uses <code>dist.${escHtml(missingSecName)}</code>, which requires section "<strong>${escHtml(missingSecName)}</strong>" to have a backup address. Click + on that section block to enable backup.</p>`,
        'OK',
        () => { closeUiModal(); backupWarningShown = false; }
      );
    }
  }

  ws.addChangeListener(e => {
    if (isLoadingSave) return;
    if (e.type === Blockly.Events.BLOCK_CREATE) {
      const ids = e.ids || (e.blockId ? [e.blockId] : []);
      for (const id of ids) {
        const created = ws.getBlockById(id);
        if (!created || created.isShadow()) continue;
        if (isLabelBlock(created)) {
          const cur = (created.getFieldValue('NAME') || '').trim();
          const defName = created.type === 'rsc_loop_back' ? 'restore' : 'start';
          if (!cur || isLabelNameTaken(cur, created)) {
            Blockly.Events.disable();
            try {
              created.setFieldValue(makeUniqueLabelName(cur || defName, created), 'NAME');
            } finally {
              Blockly.Events.enable();
            }
          }
        } else if (created.type === 'rsc_custom_code') {
          created.setWarningText('Warning: Custom code is not validated and may cause compilation errors.');
          if (!customCodeWarningShown) pendingCustomCodeWarning = true;
        }
      }
      if (e.blockId) pulseBlock(e.blockId, 'rsc-anim-enter', 220);
      syncAddrOfBlocks();
      validateLoopBackBlocks(false);
    }
    if (e.type === Blockly.Events.BLOCK_MOVE && !ws.isDragging()) {
      if (e.newParentId && e.newParentId !== e.oldParentId) {
        pulseBlock(e.blockId, 'rsc-anim-snap', 340);
      }
      for (const sec of ws.getTopBlocks(false)) {
        if (sec.type !== 'rsc_section') continue;
        let cur = sec.getNextBlock();
        while (cur) {
          if (!isLabelBlock(cur)) {
            cur.previousConnection.disconnect();
            cur.moveBy(24, 24);
            if (!sectionWarningShown) {
              sectionWarningShown = true;
              openUiModal(
                'Invalid section placement',
                '<p>Code can only be placed inside labels in a section tower.</p>',
                'OK',
                () => { closeUiModal(); sectionWarningShown = false; }
              );
            }
            break;
          }
          cur = cur.getNextBlock();
        }
      }
      const moved = e.blockId && ws.getBlockById(e.blockId);
      syncAddrOfBlocks();
      validateLoopBackBlocks(!!(moved && moved.type === 'rsc_loop_back'));
      if (pendingCustomCodeWarning && !customCodeWarningShown && uiModal.style.display !== 'flex') {
        pendingCustomCodeWarning = false;
        customCodeWarningShown = true;
        openUiModal(
          'Custom code warning',
          '<p>Using the custom code block bypasses validation and may cause compilation errors.</p>',
          'OK',
          closeUiModal
        );
      }
    }
    if (e.type === Blockly.Events.BLOCK_CHANGE || e.type === Blockly.Events.BLOCK_DELETE) {
      syncAddrOfBlocks();
      validateLoopBackBlocks(false);
    }
    if (!e.isUiEvent) { out.textContent = RSC.workspaceToCode(ws); scheduleAutosave(); }
  });

  function updateOutput() { out.textContent = RSC.workspaceToCode(ws); scheduleAutosave(); }
  function initializeDefaultBlocks() {
    customCodeWarningShown = false;
    pendingCustomCodeWarning = false;
    ws.clear();
    const section = ws.newBlock('rsc_section');
    section.setFieldValue('main', 'NAME');
    section.setFieldValue('D730', 'ADDR');
    section.setBackup_(true);
    section.setFieldValue('E9E0', 'BACKUP');
    section.initSvg(); section.render(); section.moveBy(32, 32);
    section.setDeletable(false);
    updateOutput();
  }
  document.getElementById('btn-reset').addEventListener('click', initializeDefaultBlocks);
  document.getElementById('btn-copy').addEventListener('click', async () => {
    const btn = document.getElementById('btn-copy');
    try {
      await navigator.clipboard.writeText(out.textContent || '');
      btn.textContent = 'Copied';
      setTimeout(() => btn.textContent = 'Copy', 1200);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = out.textContent || ''; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1200);
    }
  });

  // --- Savefiles (JSON Export / Import + localStorage Autosave) ---
  const AUTOSAVE_KEY = 'rsc_blockly_autosave_v1';
  const API_URL_KEY = 'rsc_blockly_api_url_v1';
  const DEFAULT_COMPILE_ENDPOINT = 'https://casiovn.vercel.app/api/rac';
  let autosaveTimer = null;

  function buildSavePayload() {
    return {
      format: 'rsc-blockly',
      version: 1,
      savedAt: new Date().toISOString(),
      workspace: Blockly.serialization.workspaces.save(ws)
    };
  }

  function scheduleAutosave() {
    if (isLoadingSave || !ws) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      try {
        localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(buildSavePayload()));
      } catch {}
    }, 250);
  }

  function loadWorkspaceFromPayload(payload) {
    const state = payload && typeof payload === 'object' && payload.workspace && typeof payload.workspace === 'object'
      ? payload.workspace
      : payload;
    if (!state || typeof state !== 'object' || !state.blocks) {
      throw new Error('Invalid RSC savefile format.');
    }
    isLoadingSave = true;
    Blockly.Events.disable();
    try {
      ws.clear();
      Blockly.serialization.workspaces.load(state, ws);
      for (const blk of ws.getAllBlocks(false)) {
        if (blk.type === 'rsc_custom_code' && !blk.isShadow()) {
          blk.setWarningText('Warning: Custom code is not validated and may cause compilation errors.');
        }
      }
    } finally {
      Blockly.Events.enable();
      isLoadingSave = false;
    }
    syncAddrOfBlocks();
    validateLoopBackBlocks(false);
    out.textContent = RSC.workspaceToCode(ws);
    scheduleAutosave();
    Blockly.svgResize(ws);
  }

  function downloadSaveFile() {
    const payload = buildSavePayload();
    const topSec = ws.getTopBlocks(true).find(b => b.type === 'rsc_section');
    const rawName = (topSec && topSec.getFieldValue('NAME') || 'project').trim();
    const safeName = rawName.replace(/[^a-z0-9_-]+/gi, '_') || 'project';
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safeName}.rscb.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    const btn = document.getElementById('btn-save');
    btn.textContent = 'Saved';
    setTimeout(() => btn.textContent = 'Save', 1200);
  }

  const btnSave = document.getElementById('btn-save');
  const btnLoad = document.getElementById('btn-load');
  const fileLoad = document.getElementById('file-load');

  btnSave.addEventListener('click', downloadSaveFile);
  btnLoad.addEventListener('click', () => { fileLoad.value = ''; fileLoad.click(); });
  fileLoad.addEventListener('change', async () => {
    const file = fileLoad.files && fileLoad.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      loadWorkspaceFromPayload(JSON.parse(text));
    } catch (err) {
      openUiModal(
        'Load failed',
        `<p>Could not load savefile: ${escHtml(err && err.message ? err.message : String(err))}</p>`,
        'OK',
        closeUiModal
      );
    }
  });
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      downloadSaveFile();
    }
  });

  // --- Remote RAC Compiler & Separate Notifications Window ---
  const btnCompile = document.getElementById('btn-compile');
  const compilePane = document.getElementById('compile-pane');
  const compileStatus = document.getElementById('compile-status');
  const compileOutput = document.getElementById('compile-output');
  const btnApiUrl = document.getElementById('btn-api-url');
  const btnCopyCompiled = document.getElementById('btn-copy-compiled');
  const btnCloseCompiled = document.getElementById('btn-close-compiled');
  const btnNotifs = document.getElementById('btn-notifs');
  const notifBadge = document.getElementById('notif-badge');
  const notifWin = document.getElementById('notif-win');
  const notifHdr = document.getElementById('notif-hdr');
  const notifList = document.getElementById('notif-list');
  const notifClear = document.getElementById('notif-clear');
  const notifClose = document.getElementById('notif-close');

  function getCompileEndpoint() {
    try {
      return (localStorage.getItem(API_URL_KEY) || '').trim() || DEFAULT_COMPILE_ENDPOINT;
    } catch {
      return DEFAULT_COMPILE_ENDPOINT;
    }
  }

  btnApiUrl.addEventListener('click', () => {
    const cur = getCompileEndpoint();
    openUiModal(
      'Compiler API URL',
      `<label>Endpoint (or local CORS proxy)<input id="api-url-input" type="url" value="${escHtml(cur)}" placeholder="${DEFAULT_COMPILE_ENDPOINT}"></label>` +
      `<p style="color:#a3a3a3;font-size:12px;margin:2px 0 0;">Leave blank to reset to default (${DEFAULT_COMPILE_ENDPOINT}).</p>`,
      'Save',
      body => {
        const val = body.querySelector('#api-url-input').value.trim();
        try {
          if (val) localStorage.setItem(API_URL_KEY, val);
          else localStorage.removeItem(API_URL_KEY);
        } catch {}
        closeUiModal();
      }
    );
  });

  function setCompileBadge(text, state) {
    compileStatus.textContent = text;
    compileStatus.className = 'text-[10px] font-mono px-1.5 py-0.5 rounded ' + (
      state === 'ok' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800/70' :
      state === 'err' ? 'bg-rose-950 text-rose-300 border border-rose-800/70' :
      'bg-neutral-800 text-neutral-300'
    );
  }

  function renderNotifications(items) {
    notifList.innerHTML = '';
    const list = Array.isArray(items) ? items.map(x => String(x)) : [];
    notifBadge.textContent = String(list.length);
    notifBadge.className = 'text-[10px] font-mono px-1 rounded ' + (
      list.length ? 'bg-amber-500/20 text-amber-300' : 'bg-neutral-800 text-neutral-400'
    );
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'notif-empty';
      empty.textContent = 'No notifications.';
      notifList.appendChild(empty);
      return;
    }
    for (const msg of list) {
      const el = document.createElement('div');
      el.className = 'notif-item';
      el.textContent = msg;
      notifList.appendChild(el);
    }
  }

  function openNotifWin() { notifWin.style.display = 'flex'; }
  function closeNotifWin() { notifWin.style.display = 'none'; }

  btnNotifs.addEventListener('click', () => {
    if (notifWin.style.display === 'flex') closeNotifWin();
    else openNotifWin();
  });
  notifClear.addEventListener('click', () => renderNotifications([]));
  notifClose.addEventListener('click', closeNotifWin);
  btnCloseCompiled.addEventListener('click', () => compilePane.classList.add('hidden'));
  btnCopyCompiled.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(compileOutput.textContent || '');
      btnCopyCompiled.textContent = 'Copied';
      setTimeout(() => btnCopyCompiled.textContent = 'Copy', 1200);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = compileOutput.textContent || ''; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      btnCopyCompiled.textContent = 'Copied';
      setTimeout(() => btnCopyCompiled.textContent = 'Copy', 1200);
    }
  });

  // Make notifications window draggable and isolated from Blockly events
  notifWin.addEventListener('pointerdown', e => e.stopPropagation());
  notifWin.addEventListener('keydown', e => e.stopPropagation());
  let dragNotif = null;
  notifHdr.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const r = notifWin.getBoundingClientRect();
    notifWin.style.left = r.left + 'px';
    notifWin.style.top = r.top + 'px';
    notifWin.style.right = 'auto';
    notifWin.style.bottom = 'auto';
    dragNotif = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    notifHdr.setPointerCapture(e.pointerId);
  });
  notifHdr.addEventListener('pointermove', e => {
    if (!dragNotif) return;
    const x = Math.max(8, Math.min(window.innerWidth - notifWin.offsetWidth - 8, e.clientX - dragNotif.dx));
    const y = Math.max(8, Math.min(window.innerHeight - notifWin.offsetHeight - 8, e.clientY - dragNotif.dy));
    notifWin.style.left = x + 'px';
    notifWin.style.top = y + 'px';
  });
  notifHdr.addEventListener('pointerup', () => { dragNotif = null; });
  notifHdr.addEventListener('pointercancel', () => { dragNotif = null; });

  async function postCompile(endpoint, bodyStr) {
    try {
      return await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: bodyStr
      });
    } catch (err) {
      // Fallback to a CORS-safelisted simple request (skips OPTIONS preflight)
      // in case the server sends Access-Control-Allow-Origin on POST but not OPTIONS.
      return await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: bodyStr
      });
    }
  }

  btnCompile.addEventListener('click', async () => {
    renderNotifications([]);
    compilePane.classList.remove('hidden');
    compileOutput.textContent = '';
    setCompileBadge('Compiling...', 'idle');
    btnCompile.disabled = true;
    btnCompile.textContent = 'Compiling...';
    const endpoint = getCompileEndpoint();
    const bodyStr = JSON.stringify({ code: out.textContent || '', model: '580vnx' });
    try {
      const res = await postCompile(endpoint, bodyStr);
      const data = await res.json().catch(() => null);
      if (!data || typeof data !== 'object') {
        throw new Error(`HTTP ${res.status}: Invalid JSON response`);
      }
      const ok = Boolean(data.success);
      setCompileBadge(ok ? 'Success' : 'Error', ok ? 'ok' : 'err');
      compileOutput.textContent = typeof data.output === 'string' ? data.output : '';
      const notifs = Array.isArray(data.notifications) ? data.notifications : [];
      renderNotifications(notifs);
      if (notifs.length) openNotifWin();
    } catch (err) {
      setCompileBadge('Error', 'err');
      compileOutput.textContent = '';
      const msg = err && err.message ? err.message : String(err);
      const isCors = err instanceof TypeError || /failed to fetch/i.test(msg);
      const tips = [`Request failed: ${msg}`];
      if (isCors) {
        tips.push(
          `CORS blocked by ${endpoint}` + (location.origin === 'null' ? ' (opened from file:// / origin "null")' : '') +
          '. The API server does not send Access-Control-Allow-Origin headers for cross-origin browser requests. ' +
          'Fix by enabling CORS on the server, hosting on the same origin, or pointing the "API" button to a local CORS proxy.'
        );
      }
      renderNotifications(tips);
      openNotifWin();
    } finally {
      btnCompile.disabled = false;
      btnCompile.textContent = 'Compile';
    }
  });

  window.addEventListener('resize', () => Blockly.svgResize(ws));
  window.addEventListener('load', () => {
    let restored = false;
    try {
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if (raw) {
        loadWorkspaceFromPayload(JSON.parse(raw));
        restored = true;
      }
    } catch {}
    if (!restored) initializeDefaultBlocks();
    Blockly.svgResize(ws);
  });

})();

  </script>
</body>
</html>
