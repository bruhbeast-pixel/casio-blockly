<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSC Blockly Editor</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Blockly -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>

  <style>
    /* Fix 1: Ensure Blockly's flyout scrollbar hides cleanly when flyout is closed and never blocks trashcan */
    .blocklyFlyout[style*="display: none"] + .blocklyFlyoutScrollbar,
    .blocklyFlyout[aria-hidden="true"] + .blocklyFlyoutScrollbar {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Light-mode Gemini-styled Blockly UI (workspace & blocks only) */
    @keyframes rscBlockEnter {
      0% { opacity: 0; filter: brightness(1.18) drop-shadow(0 0 12px rgba(37, 99, 235, 0.35)); }
      100% { opacity: 1; filter: brightness(1) drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14)); }
    }
    @keyframes rscBlockSnap {
      0% { filter: drop-shadow(0 0 0 rgba(37, 99, 235, 0)); }
      35% { filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.55)); }
      100% { filter: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14)); }
    }
    @keyframes rscMenuPop {
      0% { opacity: 0; transform: translateY(-4px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes rscFlyoutFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .rsc-anim-enter > .blocklyPath {
      animation: rscBlockEnter 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rsc-anim-snap > .blocklyPath {
      animation: rscBlockSnap 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .blocklyTrash {
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 150ms ease, filter 150ms ease;
    }
    .blocklyTrash:hover {
      opacity: 1;
      filter: drop-shadow(0 2px 6px rgba(15, 23, 42, 0.2));
    }
    .blocklyZoom {
      opacity: 0.75;
      transition: opacity 150ms ease;
    }
    .blocklyZoom:hover { opacity: 1; }

    .blocklyToolboxDiv {
      background-color: #f1f5f9 !important;
      border-right: 1px solid #e2e8f0;
      padding-top: 10px;
    }
    .blocklyTreeRow {
      height: 34px !important;
      line-height: 34px !important;
      margin: 2px 8px !important;
      border-radius: 8px !important;
      padding-right: 12px !important;
      transition: background-color 150ms ease, transform 150ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 150ms ease;
    }
    .blocklyTreeRow:hover {
      background-color: #e2e8f0 !important;
      transform: translateX(2px);
    }
    .blocklyTreeRow.blocklyTreeSelected {
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
      transform: translateX(2px);
    }
    .blocklyTreeLabel {
      font-family: 'Inter', sans-serif !important;
      font-size: 13.5px !important;
      font-weight: 500 !important;
      color: #334155 !important;
      transition: color 150ms ease;
    }
    .blocklyTreeSelected .blocklyTreeLabel {
      color: #ffffff !important;
      font-weight: 600 !important;
    }

    .blocklyFlyout {
      animation: rscFlyoutFade 160ms ease-out;
    }
    .blocklyFlyoutBackground {
      fill: #f1f5f9 !important;
      fill-opacity: 0.96 !important;
    }

    .blocklyPath {
      stroke-width: 1.25px;
      transition: filter 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
    }
    .blocklyDraggable > .blocklyPath {
      filter: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14));
    }
    .blocklyDraggable:hover > .blocklyPath {
      filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.2));
    }
    .blocklyDragging > .blocklyPath {
      filter: drop-shadow(0 12px 24px rgba(15, 23, 42, 0.28));
    }
    .blocklySelected > .blocklyPath {
      stroke: #1e293b !important;
      stroke-width: 2.2px !important;
      filter: drop-shadow(0 4px 12px rgba(37, 99, 235, 0.3));
    }

    /* Bigger, crisp block label typography */
    .blocklyText {
      font-family: 'Inter', sans-serif !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      fill: #ffffff !important;
      letter-spacing: 0.005em;
    }

    /* Fixed light-mode editable field & dropdown pills (Blockly v9–v12+ compatible) */
    .blocklyEditableField > rect.blocklyFieldRect,
    .blocklyEditableText > rect.blocklyFieldRect,
    .blocklyEditableField > .blocklyFieldRect,
    .blocklyEditableText > .blocklyFieldRect,
    .blocklyDropdownRect {
      fill: #ffffff !important;
      fill-opacity: 0.96 !important;
      stroke: rgba(15, 23, 42, 0.18) !important;
      stroke-width: 1px !important;
      rx: 7px;
      ry: 7px;
      transition: fill 140ms ease, stroke 140ms ease;
    }
    .blocklyEditableField:hover > rect.blocklyFieldRect,
    .blocklyEditableText:hover > rect.blocklyFieldRect,
    .blocklyEditableField:hover > .blocklyFieldRect,
    .blocklyEditableText:hover > .blocklyFieldRect,
    .blocklyEditableField:hover > .blocklyDropdownRect {
      fill: #ffffff !important;
      fill-opacity: 1 !important;
      stroke: rgba(15, 23, 42, 0.42) !important;
    }
    .blocklySvg .blocklyEditableField > text.blocklyText,
    .blocklySvg .blocklyEditableText > text.blocklyText,
    .blocklySvg .blocklyEditableField text.blocklyText,
    .blocklySvg .blocklyEditableText text.blocklyText,
    .blocklySvg text.blocklyDropdownText,
    .blocklySvg text.blocklyDropdownText tspan,
    .blocklySvg .blocklyDropdownText,
    .blocklySvg .blocklyDropdownText tspan {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      fill: #0f172a !important;
    }
    .blocklyHtmlInput {
      background-color: #ffffff !important;
      color: #0f172a !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      border: 1.5px solid #2563eb !important;
      border-radius: 7px !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18) !important;
      transition: box-shadow 140ms ease, border-color 140ms ease;
    }

    /* Light-mode dropdown & context menus */
    body .blocklyDropDownDiv {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 10px !important;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16) !important;
      animation: rscMenuPop 140ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body .blocklyDropDownDiv .blocklyDropDownArrow {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
    }
    body .blocklyDropDownDiv .blocklyMenu {
      background-color: transparent !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItem,
    body .blocklyDropDownDiv .blocklyMenuItemContent {
      color: #0f172a !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      border-radius: 6px !important;
      transition: background-color 120ms ease, color 120ms ease;
    }
    body .blocklyDropDownDiv .blocklyMenuItemSelected .blocklyMenuItemContent {
      color: #0f172a !important;
      font-weight: 600 !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemCheckbox {
      filter: brightness(0) saturate(100%) invert(26%) sepia(93%) saturate(2351%) hue-rotate(213deg) brightness(95%) contrast(94%) !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemHighlight,
    body .blocklyWidgetDiv .blocklyMenuItemHighlight {
      background-color: rgba(37, 99, 235, 0.12) !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemHighlight .blocklyMenuItemContent,
    body .blocklyWidgetDiv .blocklyMenuItemHighlight .blocklyMenuItemContent {
      color: #1d4ed8 !important;
    }
    body .blocklyWidgetDiv .blocklyMenu {
      background-color: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 10px !important;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16) !important;
      padding: 4px !important;
      animation: rscMenuPop 140ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body .blocklyWidgetDiv .blocklyMenuItemContent {
      color: #1e293b !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 13px !important;
    }
    body .blocklyDropDownDiv .blocklyMenuItemDisabled .blocklyMenuItemContent,
    body .blocklyWidgetDiv .blocklyMenuItemDisabled .blocklyMenuItemContent {
      color: #94a3b8 !important;
    }

    /* Light-mode flyout buttons */
    .blocklyFlyoutButton { cursor: pointer; }
    .blocklyFlyoutButtonShadow { fill: transparent !important; }
    .blocklyFlyoutButtonBackground {
      fill: #ffffff !important;
      stroke: #cbd5e1 !important;
      stroke-width: 1px !important;
      rx: 8px;
      ry: 8px;
      transition: fill 150ms ease, stroke 150ms ease, filter 150ms ease;
    }
    .blocklyFlyoutButton:hover .blocklyFlyoutButtonBackground {
      fill: #eff6ff !important;
      stroke: #2563eb !important;
      filter: drop-shadow(0 2px 5px rgba(37, 99, 235, 0.16));
    }
    .blocklyFlyoutButton .blocklyText {
      fill: #1e293b !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 13px !important;
      font-weight: 500 !important;
    }
 
    #bm-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:999; padding:16px; }
    #bm-box { background:#1e1e1e; color:#eee; padding:12px; border:1px solid #555; display:flex; flex-direction:column; gap:8px; max-width:90vw; max-height:90vh; }
    #bm-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-family:monospace; }
    #bm-bar input { width:46px; background:#111; color:#eee; border:1px solid #555; padding:2px 4px; font:inherit; }
    #bm-bar button { background:#333; color:#eee; border:1px solid #666; padding:2px 8px; font:inherit; cursor:pointer; }
    #bm-wrap { overflow:auto; max-height:65vh; border:1px solid #444; background:#fff; align-self:center; }
    #bm-cv { display:block; cursor:crosshair; image-rendering:pixelated; }
    #ui-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.68); align-items:center; justify-content:center; z-index:1000; padding:16px; }
    #ui-modal-box { width:min(360px, 90vw); background:#1e1e1e; color:#eee; border:1px solid #525252; border-radius:6px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    #ui-modal-title { margin:0 0 12px; font-size:14px; font-weight:600; }
    #ui-modal-body { display:flex; flex-direction:column; gap:8px; font-size:13px; }
    #ui-modal-body input, #ui-modal-body select { width:100%; box-sizing:border-box; background:#111; color:#eee; border:1px solid #555; border-radius:3px; padding:7px 8px; }
    #ui-modal-actions { display:flex; justify-content:flex-end; gap:6px; margin-top:12px; }
    #ui-modal-actions button { border:1px solid #666; border-radius:3px; background:#333; color:#eee; padding:5px 10px; cursor:pointer; }
    #ui-modal-actions button:last-child { background:#e5e5e5; color:#171717; border-color:#e5e5e5; }
    #btn-about { width:18px; height:18px; padding:0; border:0; border-radius:50%; background:transparent; color:#525252; font-size:12px; line-height:18px; }
    #btn-about:hover { color:#a3a3a3; }

  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans h-screen flex flex-col lg:flex-row overflow-hidden antialiased selection:bg-orange-500/30">

  <!-- Left / Top: Blockly Workspace -->
  <main class="flex-1 relative min-h-[58%] lg:min-h-0 bg-neutral-100 overflow-hidden">
    <div id="blocklyDiv" class="absolute inset-0 w-full h-full"></div>
  </main>

  <!-- Right / Bottom: Minimal RSC Output Panel -->
  <aside class="w-full lg:w-[380px] xl:w-[440px] h-[42%] lg:h-full bg-neutral-950 border-t lg:border-t-0 lg:border-l border-neutral-800 flex flex-col shrink-0">
    
    <!-- Minimal Controls Strip -->
    <div class="px-3 py-2 border-b border-neutral-800/80 flex items-center justify-between shrink-0">
      <span class="text-[11px] font-mono uppercase tracking-widest text-neutral-500">RSC</span>
      <div class="flex items-center gap-1.5">
        <button id="btn-about" type="button" title="About">i</button>
        <button 
          id="btn-reset" 
          type="button"
          class="px-2.5 py-1 text-xs font-medium rounded bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-neutral-800 transition-colors cursor-pointer"
        >
          Reset
        </button>
        <button 
          id="btn-copy" 
          type="button"
          class="px-2.5 py-1 text-xs font-medium rounded bg-neutral-100 hover:bg-white text-neutral-950 transition-colors cursor-pointer"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- Live Output -->
    <div class="flex-1 p-4 overflow-auto">
      <pre id="rsc-output" class="font-mono text-sm leading-relaxed text-neutral-100 whitespace-pre select-all">@section.main at 0xD730 backup 0xE9E0</pre>
    </div>

  </aside>

  <div id="bm-modal">
    <div id="bm-box">
      <div id="bm-bar">
        <span>W:</span><input id="bm-w" type="number" min="1" max="128" value="8">
        <span>H:</span><input id="bm-h" type="number" min="1" max="128" value="8">
        <button id="bm-resize" type="button">Resize</button>
        <button id="bm-clear" type="button">Clear</button>
        <button id="bm-inv" type="button">Invert</button>
        <button id="bm-done" type="button">Done</button>
      </div>
      <div id="bm-wrap"><canvas id="bm-cv"></canvas></div>
    </div>
  </div>
  <div id="ui-modal">
    <div id="ui-modal-box">
      <h2 id="ui-modal-title"></h2>
      <div id="ui-modal-body"></div>
      <div id="ui-modal-actions">
        <button id="ui-modal-cancel" type="button">Cancel</button>
        <button id="ui-modal-confirm" type="button">OK</button>
      </div>
    </div>
  </div>

  <script>
(() => {
  const geminiTheme = Blockly.Theme.defineTheme('rscGeminiLight', {
    base: Blockly.Themes.Zelos || Blockly.Themes.Classic,
    blockStyles: {
      dt_blocks:      { colourPrimary: '#0f766e', colourSecondary: '#115e59', colourTertiary: '#134e4a' },
      starter_blocks: { colourPrimary: '#d95716', colourSecondary: '#b8430b', colourTertiary: '#9a3412' },
      memory_blocks:  { colourPrimary: '#2563eb', colourSecondary: '#1d4ed8', colourTertiary: '#1e40af' },
      gadget_blocks:  { colourPrimary: '#7c3aed', colourSecondary: '#6d28d9', colourTertiary: '#5b21b6' }
    },
    categoryStyles: {
      dt_category:      { colour: '#0f766e' },
      starter_category: { colour: '#d95716' },
      memory_category:  { colour: '#2563eb' },
      gadget_category:  { colour: '#7c3aed' }
    },
    componentStyles: {
      workspaceBackgroundColour: '#f8fafc',
      toolboxBackgroundColour: '#f1f5f9',
      toolboxForegroundColour: '#334155',
      flyoutBackgroundColour: '#f1f5f9',
      flyoutForegroundColour: '#1e293b',
      flyoutOpacity: 0.96,
      scrollbarColour: '#cbd5e1',
      scrollbarOpacity: 0.8,
      insertionMarkerColour: '#2563eb',
      insertionMarkerOpacity: 0.35,
      selectedGlowColour: '#2563eb',
      selectedGlowOpacity: 0.3
    },
    fontStyle: {
      family: 'Inter, sans-serif',
      weight: '500',
      size: 14
    }
  });
  const svg = d => 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="4.5" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.55)" stroke-width="1"/><path d="${d}" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg>`
  );
  const ADD_ICON = svg('M8 4v8M4 8h8');
  const SUB_ICON = svg('M4 8h8');

  class FieldBtn extends Blockly.Field {
    constructor(text, fn) {
      super(text);
      this.EDITABLE = true;
      this.SERIALIZABLE = true;
      this.CURSOR = 'pointer';
      this.fn_ = fn;
    }
    showEditor_() {
      const b = this.getSourceBlock();
      if (b && !b.isInFlyout && this.fn_) this.fn_(b);
    }
  }

  let dtStmt = false;
  let ws = null;

  const uiModal = document.getElementById('ui-modal');
  const uiModalTitle = document.getElementById('ui-modal-title');
  const uiModalBody = document.getElementById('ui-modal-body');
  const uiModalConfirm = document.getElementById('ui-modal-confirm');
  const uiModalCancel = document.getElementById('ui-modal-cancel');
  let uiModalAction = null;

  function openUiModal(title, bodyHtml, actionLabel, action) {
    uiModalTitle.textContent = title;
    uiModalBody.innerHTML = bodyHtml;
    uiModalConfirm.textContent = actionLabel;
    uiModalAction = action;
    uiModal.style.display = 'flex';
    const firstInput = uiModalBody.querySelector('input, select');
    if (firstInput) firstInput.focus();
  }

  function closeUiModal() {
    uiModal.style.display = 'none';
    uiModalAction = null;
  }

  uiModalConfirm.addEventListener('click', () => {
    if (uiModalAction) uiModalAction(uiModalBody);
  });
  uiModalCancel.addEventListener('click', closeUiModal);
  uiModal.addEventListener('click', e => { if (e.target === uiModal) closeUiModal(); });
  uiModal.addEventListener('keydown', e => e.stopPropagation());

  function setDtShape(b, asStmt) {
    b.isStmt_ = !!asStmt && !b.isShadow();
    if (b.isStmt_) {
      b.setOutput(false);
      b.setPreviousStatement(true, 'STMT');
      b.setNextStatement(true, 'STMT');
    } else {
      b.setPreviousStatement(false);
      b.setNextStatement(false);
      b.setOutput(true);
    }
  }

  function dtExtra() {
    return {
      saveExtraState() { return { stmt: this.isStmt_ }; },
      loadExtraState(s) { setDtShape(this, s && s.stmt); }
    };
  }

  const fmtHex = raw => {
    const t = raw.trim();
    return t ? (/\s/.test(t) ? t.replace(/\s+/g, ' ') : (t.match(/.{1,2}/g) || []).join(' ')) : '';
  };
  const stripHex = s => s.replace(/^hex\s+/i, '').trim();
  const hex0x = v => '0x' + v.trim().replace(/^0x/i, '');

  // --- Bitmap Editor ---
  const bmModal = document.getElementById('bm-modal');
  const bmW = document.getElementById('bm-w');
  const bmH = document.getElementById('bm-h');
  const bmCv = document.getElementById('bm-cv');
  const bmCtx = bmCv.getContext('2d');
  let activeBmBlock = null, editW = 8, editH = 8, editBits = [], paintVal = 1, painting = false;

  function drawBm() {
    const cell = Math.max(8, Math.min(22, Math.floor(360 / Math.max(editW, editH))));
    bmCv.width = editW * cell;
    bmCv.height = editH * cell;
    bmCv.dataset.cell = String(cell);
    drawBmPixels();
  }

  function drawBmPixels() {
    const cell = Number(bmCv.dataset.cell) || 8;
    bmCtx.fillStyle = '#fff';
    bmCtx.fillRect(0, 0, bmCv.width, bmCv.height);
    bmCtx.fillStyle = '#000';
    for (let y = 0; y < editH; y++) {
      for (let x = 0; x < editW; x++) {
        if (editBits[y * editW + x]) bmCtx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    bmCtx.strokeStyle = '#ccc';
    bmCtx.lineWidth = 1;
    for (let x = 0; x <= editW; x++) {
      bmCtx.beginPath(); bmCtx.moveTo(x * cell + .5, 0); bmCtx.lineTo(x * cell + .5, bmCv.height); bmCtx.stroke();
    }
    for (let y = 0; y <= editH; y++) {
      bmCtx.beginPath(); bmCtx.moveTo(0, y * cell + .5); bmCtx.lineTo(bmCv.width, y * cell + .5); bmCtx.stroke();
    }
  }

  function openBmEditor(block) {
    if (!block || block.isInFlyout || !block.workspace || block.workspace !== ws) return;
    activeBmBlock = block;
    editW = block.bmW_;
    editH = block.bmH_;
    editBits = block.bmBits_.slice();
    bmW.value = editW;
    bmH.value = editH;
    const flyout = ws.getFlyout();
    if (flyout && flyout.isVisible()) flyout.hide();
    bmModal.style.display = 'flex';
    drawBm();
    Blockly.svgResize(ws);
  }

  function cvCell(e) {
    const r = bmCv.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / (r.width / editW));
    const y = Math.floor((e.clientY - r.top) / (r.height / editH));
    return (x >= 0 && x < editW && y >= 0 && y < editH) ? y * editW + x : -1;
  }

  bmCv.addEventListener('pointerdown', e => {
    const i = cvCell(e);
    if (i < 0) return;
    painting = true;
    bmCv.setPointerCapture(e.pointerId);
    paintVal = editBits[i] ? 0 : 1;
    editBits[i] = paintVal;
    drawBmPixels();
  });
  bmCv.addEventListener('pointermove', e => {
    if (!painting) return;
    const i = cvCell(e);
    if (i >= 0 && editBits[i] !== paintVal) {
      editBits[i] = paintVal;
      drawBmPixels();
    }
  });
  bmCv.addEventListener('pointerup', () => { painting = false; });
  bmCv.addEventListener('pointercancel', () => { painting = false; });
  bmCv.addEventListener('lostpointercapture', () => { painting = false; });

  document.getElementById('bm-resize').onclick = () => {
    const nw = Math.max(1, Math.min(128, parseInt(bmW.value, 10) || 8));
    const nh = Math.max(1, Math.min(128, parseInt(bmH.value, 10) || 8));
    bmW.value = nw; bmH.value = nh;
    const next = new Array(nw * nh).fill(0);
    for (let y = 0; y < Math.min(editH, nh); y++) {
      for (let x = 0; x < Math.min(editW, nw); x++) {
        next[y * nw + x] = editBits[y * editW + x] || 0;
      }
    }
    editW = nw; editH = nh; editBits = next;
    drawBm();
  };

  // --- RSC Generator ---
  const RSC = new Blockly.Generator('RSC');
  RSC.INDENT = '  ';
  const emitDt = (b, code) => b.outputConnection ? [code, 0] : code + '\n';

  const isLabelBlock = b => !!b && (b.type === 'rsc_label' || b.type === 'rsc_loop_back');

  RSC.scrub_ = function(block, code, thisOnly) {
    if (thisOnly) return code;
    let next = block.nextConnection && block.nextConnection.targetBlock();
    if (block.type === 'rsc_section' || (isLabelBlock(block) && !block.getSurroundParent())) {
      while (next && !isLabelBlock(next)) {
        next = next.nextConnection && next.nextConnection.targetBlock();
      }
    }
    return next ? code + this.blockToCode(next) : code;
  };

  RSC.workspaceToCode = function(ws) {
    this.init(ws);
    const out = [];
    for (const b of ws.getTopBlocks(true)) {
      if (b.type !== 'rsc_section' || !b.isEnabled()) continue;
      const c = this.blockToCode(b);
      if (c) out.push((Array.isArray(c) ? c[0] : c).trimEnd());
    }
    return this.finish(out.join('\n\n'));
  };

  RSC.forBlock['rsc_hex_byte'] = b => {
    const bytes = fmtHex(b.getFieldValue('V'));
    return [bytes ? 'hex ' + bytes : 'hex', 0];
  };
  RSC.forBlock['rsc_hex_addr'] = b => [b.getFieldValue('V').trim(), 0];

  RSC.forBlock['rsc_string']  = b => emitDt(b, `"${b.getFieldValue('V')}"`);
  RSC.forBlock['rsc_integer'] = b => emitDt(b, String(b.getFieldValue('V')));
  RSC.forBlock['rsc_token']   = b => emitDt(b, `'${b.getFieldValue('V')}'`);
  RSC.forBlock['rsc_0x']        = b => emitDt(b, hex0x(b.getFieldValue('V')));
  RSC.forBlock['rsc_0x_shadow'] = b => [hex0x(b.getFieldValue('V')), 0];
  RSC.forBlock['rsc_hex']     = b => {
    const parts = [];
    for (let i = 0; i < b.itemCount_; i++) {
      const bytes = fmtHex(b.getFieldValue('V' + i) || '');
      if (bytes) parts.push(bytes);
    }
    return emitDt(b, parts.length ? 'hex ' + parts.join(' ') : 'hex');
  };
  RSC.forBlock['rsc_bitmap']  = b => {
    const bytes = [];
    for (let y = 0; y < b.bmH_; y++) {
      for (let x = 0; x < b.bmW_; x += 8) {
        let byte = 0;
        for (let bit = 0; bit < 8; bit++) {
          if (x + bit < b.bmW_ && b.bmBits_[y * b.bmW_ + x + bit]) byte |= (1 << (7 - bit));
        }
        bytes.push(byte.toString(16).padStart(2, '0'));
      }
    }
    return emitDt(b, bytes.length ? 'hex ' + bytes.join(' ') : 'hex');
  };
  RSC.forBlock['rsc_table']   = (b, g) => {
    const vals = [];
    for (let i = 0; i < b.itemCount_; i++) {
      const v = g.valueToCode(b, 'I' + i, 0);
      if (v !== '') vals.push(v);
    }
    return emitDt(b, `[${vals.join(',')}]`);
  };

  RSC.forBlock['rsc_section'] = b => {
    const bak = b.hasBackup_ ? ` backup ${hex0x(b.getFieldValue('BACKUP'))}` : '';
    return `@section.${b.getFieldValue('NAME')} at ${hex0x(b.getFieldValue('ADDR'))}${bak}\n`;
  };
  RSC.forBlock['rsc_break'] = () => 'brk\n';

  const RESET_OUT = {
    all: 'setlr_pc\nsetsfr\ndi,rt',
    buffer: 'buffer_clear',
    lr_pc: 'setlr_pc',
    sfr: 'setsfr',
    'di,rt': 'di,rt'
  };
  RSC.forBlock['rsc_reset'] = b => RESET_OUT[b.getFieldValue('OPT')] + '\n';

  RSC.forBlock['rsc_label'] = (b, g) =>
    `lbl ${b.getFieldValue('NAME')}\n${g.statementToCode(b, 'BODY')}`;
  RSC.forBlock['rsc_addr_of'] = b => [`adr(${b.getFieldValue('NAME')})`, 0];
  RSC.forBlock['rsc_set_addr'] = (b, g) => {
    const addr = stripHex(g.valueToCode(b, 'ADDR', 0) || '0x0000');
    const val = g.valueToCode(b, 'VAL', 0) || '0x00';
    return `xr0 = ${addr}, ${val}, 0x00\n[er0]=r2\n`;
  };
  RSC.forBlock['rsc_loop_back'] = (b, g) => {
    const root = b.getRootBlock();
    const secName = (root && root.type === 'rsc_section' ? (root.getFieldValue('NAME') || 'main').trim() : 'main') || 'main';
    const name = (b.getFieldValue('NAME') || 'restore').trim() || 'restore';
    const addr = (g.valueToCode(b, 'ADDR', 0) || '0x0000').trim();
    const ind = RSC.INDENT;
    return (
      `lbl ${name}\n` +
      `${ind}pop xr4, pop xr12\n` +
      `${ind}${addr}\n` +
      `${ind}hex fe03\n` +
      `${ind}eval(${addr}+dist.${secName})\n` +
      `${ind}eval(${addr}-12)\n` +
      `${ind}memcpy_auto_jump\n`
    );
  };

    const x = (g.valueToCode(b, 'X', 0) || 'hex 00').trim();

    const addr = (g.valueToCode(b, 'ADDR', 0) || '0x0000').trim();
    return `xr0 = ${x}, ${y}, ${addr}\nprintline\n`;

  RSC.forBlock['rsc_render'] = () => 'render.ddd4\n';
  RSC.forBlock['rsc_waitshift'] = () => 'waitshift\n';
  RSC.forBlock['rsc_render_bitmap'] = (b, g) => {
    const b0 = (g.valueToCode(b, 'B0', 0) || 'hex 00').trim();
    const b1 = (g.valueToCode(b, 'B1', 0) || 'hex 00').trim();
    const b2 = (g.valueToCode(b, 'B2', 0) || 'hex 00').trim();
    const b3 = (g.valueToCode(b, 'B3', 0) || 'hex 00').trim();
    const asset = (g.valueToCode(b, 'ASSET', 0) || '0x0000').trim();
    return `xr0 = ${b0}, ${b1}, ${b2}, ${b3}\nrender_bitmap\ner0 = ${asset}\n`;
  };
  RSC.forBlock['rsc_delay'] = (b, g) => {
    const ticks = (g.valueToCode(b, 'TICKS', 0) || '0x0000').trim();
    return `er0 = ${ticks}\ndelay\n`;
  };
  RSC.forBlock['rsc_calculate'] = (b, g) => {
    const calcPtr = (g.valueToCode(b, 'CALC_PTR', 0) || '0x0000').trim();
    const resultAddr = (g.valueToCode(b, 'RESULT_ADDR', 0) || '0x0000').trim();
    return `xr0 = ${calcPtr}, ${resultAddr}\ncalc_func\n`;

  RSC.forBlock['rsc_set_invert'] = b =>
    `xr0 = 0xD138, ${b.getFieldValue('MODE') || '0x01'}, 0x00\n[er0]=r2\n`;
  RSC.forBlock['rsc_draw_line'] = (b, g) => {
    const x1 = (g.valueToCode(b, 'X1', 0) || '0x00').trim();
    const y1 = (g.valueToCode(b, 'Y1', 0) || '0x00').trim();
    const x2 = (g.valueToCode(b, 'X2', 0) || '0x00').trim();
    const y2 = (g.valueToCode(b, 'Y2', 0) || '0x00').trim();
    return `xr0 = ${x1}, ${y1}, ${x2}, ${y2}\nline_draw\n`;
  };

          ]
        },
        {
          kind: 'category', name: 'Memory', categorystyle: 'memory_category',
          contents: [
            { kind: 'block', type: 'rsc_label' },
            { kind: 'block', type: 'rsc_addr_of' },
            {
              kind: 'block', type: 'rsc_set_addr',

            {
              kind: 'block', type: 'rsc_render_bitmap',
              inputs: {
                B0: { shadow: { type: 'rsc_hex_byte', fields: { V: '00' } } },
                B1: { shadow: { type: 'rsc_hex_byte', fields: { V: '00' } } },
                B2: { shadow: { type: 'rsc_hex_byte', fields: { V: '00' } } },
                B3: { shadow: { type: 'rsc_hex_byte', fields: { V: '00' } } },
                ASSET: { shadow: { type: 'rsc_0x_shadow', fields: { V: '0000' } } }
              }
            },
            { kind: 'block', type: 'rsc_render' },
            { kind: 'block', type: 'rsc_waitshift' },
            {
              kind: 'block', type: 'rsc_delay',
              inputs: {
                TICKS: { shadow: { type: 'rsc_0x_shadow', fields: { V: '0000' } } }
              }
            },
            {
              kind: 'block', type: 'rsc_calculate',
              inputs: {
                CALC_PTR: { shadow: { type: 'rsc_0x_shadow', fields: { V: '0000' } } },
                RESULT_ADDR: { shadow: { type: 'rsc_0x_shadow', fields: { V: '0000' } } }
              }
            },
            { kind: 'block', type: 'rsc_set_invert' },
            {
              kind: 'block', type: 'rsc_draw_line',
              inputs: {
                X1: { shadow: { type: 'rsc_0x_shadow', fields: { V: '00' } } },
                Y1: { shadow: { type: 'rsc_0x_shadow', fields: { V: '00' } } },
                X2: { shadow: { type: 'rsc_0x_shadow', fields: { V: '00' } } },
                Y2: { shadow: { type: 'rsc_0x_shadow', fields: { V: '00' } } }
              }
            }
          ]
        }
      ]
    }
  });

  ws.registerButtonCallback('SWITCH_DT', () => {
    dtStmt = !dtStmt;
    ws.getToolbox().refreshSelection();
  });

  document.getElementById('btn-about').addEventListener('click', () => {
    openUiModal(
      'About',
      '<p>Made by Pancake and Omelets, @pancake94_ on Discord.</p>',
      'Close',
      closeUiModal
    );
  });

  const out = document.getElementById('rsc-output');
  let sectionWarningShown = false;
  let backupWarningShown = false;

  function pulseBlock(blockId, cls, ms) {
    const blk = blockId && ws.getBlockById(blockId);
    if (!blk || blk.isShadow()) return;
    const root = blk.getSvgRoot && blk.getSvgRoot();
    if (!root) return;
    root.classList.remove(cls);
    void root.getBoundingClientRect();
    root.classList.add(cls);
    setTimeout(() => root.classList.remove(cls), ms);
  }

  function validateLoopBackBlocks(showModalOnMissing) {
    let missingFound = false;
    for (const blk of ws.getAllBlocks(false)) {
      if (blk.type !== 'rsc_loop_back') continue;
      const root = blk.getRootBlock();
      if (root && root.type === 'rsc_section' && root.hasBackup_) {
        blk.setWarningText(null);
      } else if (root && root.type === 'rsc_section') {
        blk.setWarningText('Requires this section block to have a backup address.');
        missingFound = true;
      } else {
        blk.setWarningText(null);
      }
    }
    if (showModalOnMissing && missingFound && !backupWarningShown) {
      backupWarningShown = true;
      openUiModal(
        'Backup address required',
        '<p>The "loop back" block uses dist.&lt;section&gt;, which requires its section block to have a backup address. Click + on the section block to enable backup.</p>',
        'OK',
        () => { closeUiModal(); backupWarningShown = false; }
      );
    }
  }

  ws.addChangeListener(e => {
    if (e.type === Blockly.Events.BLOCK_CREATE && e.blockId) {
      pulseBlock(e.blockId, 'rsc-anim-enter', 220);
    }
    if (e.type === Blockly.Events.BLOCK_MOVE && !ws.isDragging()) {
      if (e.newParentId && e.newParentId !== e.oldParentId) {
        pulseBlock(e.blockId, 'rsc-anim-snap', 340);
      }
      for (const sec of ws.getTopBlocks(false)) {
        if (sec.type !== 'rsc_section') continue;
        let cur = sec.getNextBlock();
        while (cur) {
          if (!isLabelBlock(cur)) {
            cur.previousConnection.disconnect();
            cur.moveBy(24, 24);
            if (!sectionWarningShown) {
              sectionWarningShown = true;
              openUiModal(
                'Invalid section placement',
                '<p>Code can only be placed inside labels in a section tower.</p>',
                'OK',
                () => { closeUiModal(); sectionWarningShown = false; }
              );
            }
            break;
          }
          cur = cur.getNextBlock();
        }
      }
      const moved = e.blockId && ws.getBlockById(e.blockId);
      validateLoopBackBlocks(!!(moved && moved.type === 'rsc_loop_back'));
    }
    if (!e.isUiEvent) out.textContent = RSC.workspaceToCode(ws);
  });

  function updateOutput() { out.textContent = RSC.workspaceToCode(ws); }
  function initializeDefaultBlocks() {
    ws.clear();
    const section = ws.newBlock('rsc_section');
    section.setFieldValue('main', 'NAME');
    section.setFieldValue('D730', 'ADDR');
    section.setBackup_(true);
    section.setFieldValue('E9E0', 'BACKUP');
    section.initSvg(); section.render(); section.moveBy(32, 32);
    section.setDeletable(false);
    updateOutput();
  }
  document.getElementById('btn-reset').addEventListener('click', initializeDefaultBlocks);
  document.getElementById('btn-copy').addEventListener('click', async () => {
    const btn = document.getElementById('btn-copy');
    try {
      await navigator.clipboard.writeText(out.textContent || '');
      btn.textContent = 'Copied';
      setTimeout(() => btn.textContent = 'Copy', 1200);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = out.textContent || ''; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1200);
    }
  });
  window.addEventListener('resize', () => Blockly.svgResize(ws));
  window.addEventListener('load', () => { initializeDefaultBlocks(); Blockly.svgResize(ws); });

})();

  </script>
</body>
</html>
